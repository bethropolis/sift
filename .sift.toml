# .sift.toml — repository-local defaults for dumping sift itself.
# Committed so any clone can run `sift dump` with no flags. Flags still win.

default_profile = "default"

[sift]
style = "xml"
output = "codebase.xml"
compress_mode = "full"
fallback_mode = "signatures"
fallback_threshold = 0.85
budget = "200k"
smart_filter = true
extensions = ["go", "md", "yml", "yaml", "toml", "sh"]

ignore = [
  "**/*_test.go",
  "testdata/**",
  "**/testdata/**",
  "*.test",
  "codebase*",
  "*-context.md",
  "site/node_modules/**",
  "site/dist/**",
  "site/.svelte-kit/**",
  "web/node_modules/**",
  "web/dist/**",
  "FEEDBACK.md",
  "REVIEW.md",
  "sift-tui-polish-guide.md",
  "sift-theme-and-syntax-upgrade-guide.md",
]

prompt = """
Sift is a high-performance LLM context document packer written in Go.
It scans source repositories, filters noise, prunes gitignored/hidden/binary files,
ranks files by git relevance and centrality, compresses implementations to signatures
via tree-sitter when budgeting requires, and emits structured context documents (XML, Markdown, JSON, plain).

Core architecture:
- cmd/sift: CLI entry points (dump, pick, select, diff, delta, follow, serve, skill, mcp).
- internal/app: High-level application orchestration, file collection, ranking, budgeting, and rendering.
- internal/config: Cascading configuration (.sift.toml, profiles, targets, CLI flags).
- internal/scan: Content caching, smart filtering, and tree-sitter signature compression.
- internal/tokenize: Offline BPE token counting (tiktoken) and budget packing with progressive fallback.
- internal/format: Multi-format document renderers (XML, Markdown, JSON, plain text).
- internal/ignore: High-performance tiered gitignore, hidden, and custom pattern matcher.
- internal/rank: Git-relevance scoring (recency, churn, centrality, reverse fan-in import graph).
- internal/mcp: Model Context Protocol stdio server providing context and skill tools to coding agents.
- internal/skills: Agent skills management and auto-detection for AI coding assistants.
"""

# Path-based compression mapping: core logic in full fidelity, bulky periphery in signatures.
[modes]
full = [
  "cmd/**",
  "internal/app/**",
  "internal/config/**",
  "internal/scan/**",
  "internal/tokenize/**",
  "internal/format/**",
  "internal/ignore/**",
  "internal/rank/**",
  "internal/mcp/**",
  "internal/skills/**",
  "README.md",
  "justfile",
]
signatures = [
  "internal/lang/**",
  "internal/tui/**",
  "internal/serve/**",
  "internal/selection/**",
  "internal/clipboard/**",
  "internal/secrets/**",
  "internal/summary/**",
  "internal/walker/**",
  "site/**",
  "web/**",
]
skip = [
  "**/*_test.go",
  "testdata/**",
  "**/testdata/**",
  "*.test",
  "codebase*",
  "*-context.md",
  "FEEDBACK.md",
  "REVIEW.md",
]

[profiles.default]
# Inherits [sift] defaults and [modes] mapping.

# Whole repo in signatures mode — fast, lightweight architectural orientation.
[profiles.signatures]
compress_mode = "signatures"
budget = "100k"
prompt = "Summarize what this repository does, its main packages, and how the pieces fit together."

# Core engine only — focused on core logic, ignoring UI, site, and language grammars.
[profiles.core]
compress_mode = "full"
fallback_mode = "signatures"
budget = "150k"
ignore = [
  "internal/lang/**",
  "internal/tui/**",
  "internal/serve/**",
  "site/**",
  "web/**",
]
prompt = "Review the core engine (scan, rank, render, config, app, tokenize) for correctness and error handling."

# Documentation, workflow, and configuration only.
[profiles.docs]
extensions = ["md", "yml", "yaml", "toml", "sh"]
compress_mode = "full"
budget = "50k"
prompt = "Summarize the documented behavior, CLI usage, and configuration options of Sift."

# Deep review of core Go codebase for correctness and security.
[profiles.review]
compress_mode = "full"
fallback_mode = "signatures"
budget = "250k"
prompt = "Review this Go codebase for correctness, concurrency, security, and error-handling issues. Cite file paths and line-level detail."

[scoring]
full_band = 0.75
skip_band = 0.30
skip_roles = ["test", "fixture", "mock", "generated", "vendor", "example"]

# Declarative dump artifacts for CI, tooling, and agents.
[[targets]]
name = "codebase"
profile = "default"
output = "codebase.xml"
style = "xml"

[[targets]]
name = "core"
profile = "core"
output = "core-context.xml"
style = "xml"

[[targets]]
name = "signatures"
profile = "signatures"
output = "codebase.sig.xml"
style = "xml"

[[targets]]
name = "docs"
profile = "docs"
output = "docs-context.md"
style = "markdown"

[[targets]]
name = "review"
profile = "review"
output = "review-context.md"
style = "markdown"

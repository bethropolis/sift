title: sift
tagline: Turn a codebase into an LLM-ready context document
description: >-
  sift is a command-line tool that walks a project directory, ranks files by
  relevance, and renders an LLM-ready context document with token budgeting,
  secret redaction, and signature-only compression.
url: "https://bethropolis.github.io"
baseurl: "/sift"

repository: bethropolis/sift
github_user: bethropolis
latest_release_url: "https://github.com/bethropolis/sift/releases/latest"

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

permalink: pretty

collections:
  docs:
    output: true
    permalink: /docs/:path/

defaults:
  - scope:
      path: ""
      type: "docs"
    values:
      layout: "docs"
  - scope:
      path: ""
    values:
      # Shared share-image for og:image / twitter cards (made absolute
      # by jekyll-seo-tag from site.url + baseurl).
      image: /assets/img/og.png

sass:
  style: compressed

include:
  - install.sh

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - SITE-NOTES.md
  - vendor
  - node_modules

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

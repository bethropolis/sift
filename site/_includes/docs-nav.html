<nav class="docs-nav" aria-label="Documentation">
  <a class="docs-nav__home{% if page.url == '/docs/' %} docs-nav__link--active{% endif %}" href="{{ '/docs/' | relative_url }}"{% if page.url == '/docs/' %} aria-current="page"{% endif %}>Overview</a>
  {% for section in site.data.docs_nav %}
  <p class="docs-nav__group">{{ section.group }}</p>
  <ul class="docs-nav__list">
    {% for item in section.pages %}
    <li>
      <a class="docs-nav__link{% if page.url == item.url %} docs-nav__link--active{% endif %}" href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
    </li>
    {% endfor %}
  </ul>
  {% endfor %}
</nav>

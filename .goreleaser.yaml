version: 2

project_name: sift

before:
  hooks:
    - go mod download
    - sh scripts/build-web.sh

builds:
  - id: sift
    main: ./cmd/sift
    binary: sift
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/bethropolis/sift/internal/config.Version={{.Version}}
    goos:
      - linux
      - windows
      - darwin
      - freebsd
      - android
    goarch:
      - amd64
      - arm64
    ignore:
      # Go does not provide these targets.
      - goos: darwin
        goarch: arm
      # Android builds with CGO_ENABLED=0 can only link internally, which Go
      # supports solely on arm64. Other Android arches need the NDK + cgo.
      - goos: android
        goarch: amd64

archives:
  - id: default
    ids:
      - sift
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}
    files:
      - README.md
      - LICENSE
      - packaging/sift.desktop
      - packaging/sift.png

checksum:
  name_template: checksums.txt

snapshot:
  version_template: '{{ incpatch .Version }}-next'

release:
  prerelease: auto
  mode: replace
  header: |
    ## Sift {{ .Tag }}
  footer: |
    Install with `curl -fsSL https://bethropolis.github.io/sift/install.sh | sh`.

homebrew_casks:
  - name: sift
    repository:
      owner: bethropolis
      name: homebrew-tap
      token: '{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}'
    description: LLM-friendly codebase context picker
    homepage: https://github.com/bethropolis/sift
    license: MIT
    skip_upload: '{{ not (isEnvSet "HOMEBREW_TAP_GITHUB_TOKEN") }}'

scoops:
  - name: sift
    repository:
      owner: bethropolis
      name: scoop-bucket
      token: '{{ .Env.SCOOP_BUCKET_GITHUB_TOKEN }}'
    description: LLM-friendly codebase context picker
    homepage: https://github.com/bethropolis/sift
    license: MIT
    skip_upload: '{{ not (isEnvSet "SCOOP_BUCKET_GITHUB_TOKEN") }}'


aurs:
  - name: sift-context-bin
    homepage: "https://github.com/bethropolis/sift"
    description: "Sift a codebase into an LLM-friendly context document"
    maintainers:
      - "bethropolis <bethropolis at gmail dot com>"    
    license: "MIT"
    private_key: "{{ .Env.AUR_KEY }}"
    git_url: "ssh://aur@aur.archlinux.org/sift-context-bin.git"
    disable: "{{ .IsSnapshot }}"
    provides:
      - sift
    conflicts:
      - sift
    optdepends:
      - "chromium: chromeless window for sift serve --app"
      - "git: repository cloning with sift clone and serve --allow-clone"
    package: |-
      install -Dm755 "./sift" "${pkgdir}/usr/bin/sift"
      install -Dm644 "./LICENSE" "${pkgdir}/usr/share/licenses/sift-context-bin/LICENSE"
      install -dm755 "${pkgdir}/usr/share/bash-completion/completions" \
                     "${pkgdir}/usr/share/zsh/site-functions" \
                     "${pkgdir}/usr/share/fish/vendor_completions.d"
      ./sift completion bash > "${pkgdir}/usr/share/bash-completion/completions/sift"
      ./sift completion zsh > "${pkgdir}/usr/share/zsh/site-functions/_sift"
      ./sift completion fish > "${pkgdir}/usr/share/fish/vendor_completions.d/sift.fish"
      install -Dm644 "packaging/sift.desktop" "${pkgdir}/usr/share/applications/sift.desktop"
      install -Dm644 "packaging/sift.png" "${pkgdir}/usr/share/icons/hicolor/512x512/apps/sift.png"
